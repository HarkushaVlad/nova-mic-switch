name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub draft release after platform and source checks pass
        type: boolean
        required: true
        default: false
      tag:
        description: Existing vVERSION tag pointing to this workflow's commit (required to publish)
        type: string
        required: false
        default: ''
      license_reviewed:
        description: Confirm legal/notice and real-platform review; required to upload public binaries/source archive or publish a draft
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate manual release request
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout complete history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate publish gates and resolve project version
        id: validate
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          LICENSE_REVIEWED_INPUT: ${{ inputs.license_reviewed }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          with open("pyproject.toml", "rb") as project:
              version = tomllib.load(project)["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", version):
              raise SystemExit(f"Unsafe project version: {version!r}")
          if os.environ.get("PUBLISH_INPUT", "").lower() == "true":
              tag = os.environ.get("RELEASE_TAG_INPUT", "")
              expected = f"v{version}"
              if os.environ.get("LICENSE_REVIEWED_INPUT", "").lower() != "true":
                  raise SystemExit("Publishing requires explicit license/notice and real-platform test review acknowledgement.")
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", tag) or tag != expected:
                  raise SystemExit(f"Publishing requires an existing tag exactly matching {expected}.")
              result = subprocess.run(
                  ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
                  check=False, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True,
              )
              if result.returncode != 0:
                  raise SystemExit(f"Required release tag does not exist in the checkout: {tag}")
              if result.stdout.strip() != os.environ["WORKFLOW_COMMIT"]:
                  raise SystemExit("The release tag must point to this workflow-dispatch commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

  linux-x86_64:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    needs: [validate-inputs]
    env:
      UV_NO_BINARY_PACKAGE: hidapi
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: Prepare project-local build caches
        shell: bash
        run: |
          mkdir -p build/release-tools build/pyinstaller-cache .uv-cache
          echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/.uv-cache" >> "$GITHUB_ENV"
          echo "PYINSTALLER_CONFIG_DIR=$GITHUB_WORKSPACE/build/pyinstaller-cache" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Install Linux build and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libusb-1.0-0-dev libudev-dev libegl1 libopengl0 libpulse0
      - name: Sync locked Python 3.13 environment
        run: uv sync --python 3.13 --locked --group dev
      - name: Verify Linux hidapi source build and host dependencies
        shell: bash
        run: |
          set -euo pipefail
          LOG=build/hidapi-workflow-check.log
          mkdir -p build
          : > "$LOG"
          PROOF_JSON="$(uv run --python 3.13 --locked --group dev python - <<'PY'
          import importlib
          import json
          from pathlib import Path
          import sysconfig

          modules = []
          for name in ("hidraw", "hid"):
              module = importlib.import_module(name)
              if not callable(getattr(module, "enumerate", None)) or not callable(getattr(module, "device", None)):
                  raise SystemExit(f"{name} lacks callable enumerate/device APIs")
              path = Path(module.__file__).resolve()
              modules.append(str(path))

          site_packages = Path(sysconfig.get_paths()["purelib"]).resolve()
          vendored = [path for path in site_packages.rglob("*") if "hidapi.libs" in path.parts]
          if vendored:
              raise SystemExit("Unexpected hidapi.libs package path(s): " + ", ".join(map(str, vendored)))
          if any("hidapi.libs" in Path(path).parts for path in modules):
              raise SystemExit("hid extension resolved from hidapi.libs")
          print(json.dumps(modules))
          PY
          )"
          mapfile -t HID_EXTENSIONS < <(python3 -c 'import json,sys; print("\n".join(json.loads(sys.argv[1])))' "$PROOF_JSON")
          echo 'hidraw and hid enumerate/device APIs are callable; no devices were enumerated or opened.' | tee -a "$LOG"
          echo 'hidapi.libs package paths: none' | tee -a "$LOG"
          for extension in "${HID_EXTENSIONS[@]}"; do
            echo "HID extension: $extension" | tee -a "$LOG"
            echo "readelf -d $extension" | tee -a "$LOG"
            readelf -d "$extension" 2>&1 | tee -a "$LOG"
            echo "ldd $extension" | tee -a "$LOG"
            ldd "$extension" 2>&1 | tee -a "$LOG"
          done
          if grep -E 'lib(usb-1\.0\.so\.0|udev\.so\.1) => not found' "$LOG"; then
            echo 'A required host HID library did not resolve.' >&2
            exit 1
          fi
          for dependency in 'libusb-1\.0\.so\.0' 'libudev\.so\.1'; do
            if ! grep -Eq "$dependency => /" "$LOG"; then
              echo "Expected host dependency resolution was not shown: $dependency" >&2
              exit 1
            fi
            grep -E "$dependency => /" "$LOG"
          done
      - name: Run unit tests
        run: uv run --python 3.13 --locked --group dev python -m unittest discover -s tests -v
      - name: Collect bundled third-party license notices
        run: uv run --python 3.13 --locked --group dev python scripts/collect_licenses.py --fetch-python-license
      - name: Download pinned AppImage tools
        run: |
          uv run --python 3.13 --locked --group dev python scripts/release_tools.py --tool appimagetool --output-dir build/release-tools
          uv run --python 3.13 --locked --group dev python scripts/release_tools.py --tool appimage-runtime --output-dir build/release-tools
      - name: Build Linux onedir bundle and AppImage
        shell: bash
        run: |
          scripts/build_linux.sh
          VERSION="$(uv run --python 3.13 --locked --group dev python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Unsafe project version: $VERSION" >&2
            exit 2
          fi
          scripts/build_appimage.sh --appimagetool "$GITHUB_WORKSPACE/build/release-tools/appimagetool-x86_64.AppImage" --runtime-file "$GITHUB_WORKSPACE/build/release-tools/runtime-x86_64"
          APPIMAGE="dist/linux/NovaMicSwitch-$VERSION-x86_64.AppImage"
          if [[ ! -f "$APPIMAGE" ]]; then echo "AppImage output missing: $APPIMAGE" >&2; exit 1; fi
          LICENSES="dist/linux/NovaMicSwitch/_internal/licenses"
          for path in manifest.json THIRD-PARTY-NOTICES.md Python-LICENSE.txt qt-6.12.0/LGPL-3.0-only.txt ffmpeg-9.0.1/qt_attribution.json ffmpeg-9.0.1/LICENSE.LGPL-2.1-or-later.txt; do
            test -s "$LICENSES/$path" || { echo "Frozen Linux license payload missing: $LICENSES/$path" >&2; exit 1; }
          done
          LINUX_NOTICES="$LICENSES/linux-system"
          test -s "$LINUX_NOTICES/manifest.json" || { echo "Frozen Linux system notice manifest missing: $LINUX_NOTICES/manifest.json" >&2; exit 1; }
          test -s "$LINUX_NOTICES/THIRD-PARTY-NOTICES.md" || { echo "Frozen Linux system notice index missing: $LINUX_NOTICES/THIRD-PARTY-NOTICES.md" >&2; exit 1; }
          uv run --python 3.13 --locked --group dev python - "$LINUX_NOTICES" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path, PurePosixPath

          root = Path(sys.argv[1])
          manifest_path = root / "manifest.json"
          index_path = root / "THIRD-PARTY-NOTICES.md"
          if root.is_symlink() or manifest_path.is_symlink() or index_path.is_symlink():
              raise SystemExit("Frozen Linux system-notice output contains a symlink")
          resolved_root = root.resolve(strict=True)
          manifest_path.resolve(strict=True).relative_to(resolved_root)
          index_path.resolve(strict=True).relative_to(resolved_root)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packages = manifest.get("source_packages")
          texts = manifest.get("texts")
          if manifest.get("schema") != 1 or not isinstance(packages, list) or not packages:
              raise SystemExit("Linux system-notice manifest has no validated source-package inventory")
          if not isinstance(texts, list) or not texts:
              raise SystemExit("Linux system-notice manifest has no notice texts")
          if not index_path.is_file() or index_path.stat().st_size == 0:
              raise SystemExit("Frozen Linux system-notice index is not a nonempty regular file")
          seen = set()
          for entry in texts:
              if not isinstance(entry, dict):
                  raise SystemExit("Linux system-notice manifest contains an invalid text record")
              raw = entry.get("path")
              if not isinstance(raw, str) or not raw or "\\" in raw:
                  raise SystemExit("Linux system-notice manifest contains an unsafe text path")
              relative = PurePosixPath(raw)
              if relative.is_absolute() or any(part in ("", ".", "..") for part in raw.split("/")):
                  raise SystemExit(f"Linux system-notice path escapes its root: {raw!r}")
              if relative.parts[:2] != ("notices", "package") or relative.suffix.lower() != ".txt":
                  raise SystemExit(f"Unexpected Linux system-notice text path: {raw!r}")
              if raw in seen:
                  raise SystemExit(f"Duplicate Linux system-notice text path: {raw!r}")
              seen.add(raw)
              path = root.joinpath(*relative.parts)
              cursor = root
              for part in relative.parts:
                  cursor = cursor / part
                  if cursor.is_symlink():
                      raise SystemExit(f"Linux system-notice text traverses a symlink: {raw!r}")
              resolved = path.resolve(strict=True)
              resolved.relative_to(resolved_root)
              if not resolved.is_file():
                  raise SystemExit(f"Linux system-notice text is not a regular file: {raw!r}")
              data = resolved.read_bytes()
              if not data or len(data) != entry.get("size"):
                  raise SystemExit(f"Linux system-notice text size mismatch: {raw!r}")
              if hashlib.sha256(data).hexdigest() != entry.get("sha256"):
                  raise SystemExit(f"Linux system-notice text SHA-256 mismatch: {raw!r}")
          print(f"Verified Linux system-package notices: {len(packages)} source packages, {len(texts)} notice texts.")
          PY
          echo 'Frozen Linux license manifest SHA-256:'
          sha256sum "$LICENSES/manifest.json"
          echo 'Frozen Linux bundle file count:'
          find dist/linux/NovaMicSwitch -type f | wc -l
          echo 'Frozen Linux native library inventory:'
          find dist/linux/NovaMicSwitch -type f \( -name '*.so' -o -name '*.so.*' \) -printf '%P\n' | sort
          FORBIDDEN="$(find dist/linux/NovaMicSwitch \( -iname '*virtualkeyboard*' -o -iname '*libqt6pdf*' -o -iname 'qpdf.dll' -o -iname 'libqpdf.so' \) -print -quit)"
          if [[ -n "$FORBIDDEN" ]]; then
            echo 'Frozen Linux bundle unexpectedly contains an excluded Qt Virtual Keyboard/PDF component.' >&2
            exit 1
          fi
          SMOKE_CONFIG="$GITHUB_WORKSPACE/build/linux-appimage-smoke"
          mkdir -p "$SMOKE_CONFIG"
          test ! -e "$SMOKE_CONFIG/settings.json" || { echo 'Linux smoke config unexpectedly already has settings.json' >&2; exit 1; }
          timeout 60s env QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --safe-mode --config-dir "$SMOKE_CONFIG" --smoke-test
          test ! -e "$SMOKE_CONFIG/settings.json" || { echo 'Safe-mode AppImage smoke test created settings.json' >&2; exit 1; }
          mkdir -p build/native-evidence/linux
          timeout 60s env QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --media-probe --output-json "$GITHUB_WORKSPACE/build/native-evidence/linux/media-probe.json"
          mkdir -p dist/release/linux-x86_64
          cp "$APPIMAGE" dist/release/linux-x86_64/
          (cd dist/release/linux-x86_64 && sha256sum "NovaMicSwitch-$VERSION-x86_64.AppImage" > SHA256SUMS && cp SHA256SUMS "NovaMicSwitch-$VERSION-x86_64.AppImage.sha256")
      - name: Generate Linux native dependency evidence
        run: uv run --python 3.13 --locked --group dev python scripts/native_report.py --bundle dist/linux/NovaMicSwitch --workpath build/linux --output-dir build/native-evidence
      - name: Upload Linux native evidence metadata
        if: ${{ !cancelled() && success() && hashFiles('build/native-evidence/report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-linux
          path: |
            build/native-evidence/report.json
            build/native-evidence/linux/media-probe.json
            build/native-evidence/notices/**/*.txt
          if-no-files-found: error
      - name: Upload Linux release artifact
        if: ${{ inputs.license_reviewed }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: dist/release/linux-x86_64/*
          if-no-files-found: error

  windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    needs: [validate-inputs]
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: Prepare project-local build caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\release-tools, build\pyinstaller-cache, .uv-cache | Out-Null
          "UV_CACHE_DIR=$env:GITHUB_WORKSPACE\.uv-cache" >> $env:GITHUB_ENV
          "PYINSTALLER_CONFIG_DIR=$env:GITHUB_WORKSPACE\build\pyinstaller-cache" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV
      - name: Sync locked Python 3.13 environment
        run: uv sync --python 3.13 --locked --group dev
      - name: Run unit tests
        run: uv run --python 3.13 --locked --group dev python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Collect bundled third-party license notices
        run: .\.venv\Scripts\python.exe scripts\collect_licenses.py --fetch-python-license
      - name: Download and install pinned Inno Setup
        shell: pwsh
        run: |
          $Installer = & .\.venv\Scripts\python.exe scripts\release_tools.py --tool inno-setup --output-dir build\release-tools
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup download failed with exit code $LASTEXITCODE" }
          $InstallDir = Join-Path $env:GITHUB_WORKSPACE 'build\inno-setup'
          $QuotedInstallDir = '"' + $InstallDir.Replace('"', '\"') + '"'
          $Process = Start-Process -FilePath $Installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$QuotedInstallDir") -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($Process.ExitCode)" }
          $Compiler = Join-Path $InstallDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $Compiler -PathType Leaf)) { throw "ISCC.exe missing after verified Inno Setup install: $Compiler" }
          "INNO_SETUP_COMPILER=$Compiler" >> $env:GITHUB_ENV
      - name: Build Windows onedir bundle and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -InnoSetupCompiler $env:INNO_SETUP_COMPILER
      - name: Generate Windows native dependency evidence
        run: .\.venv\Scripts\python.exe scripts\native_report.py --bundle dist\windows\NovaMicSwitch --workpath build\windows --output-dir build\native-evidence
      - name: Probe frozen Windows Qt Multimedia backend
        shell: pwsh
        run: |
          $ProbeRoot = Join-Path $env:GITHUB_WORKSPACE 'build\native-evidence\windows'
          New-Item -ItemType Directory -Force -Path $ProbeRoot | Out-Null
          $ProbeJson = Join-Path $ProbeRoot 'media-probe.json'
          $Exe = Join-Path $env:GITHUB_WORKSPACE 'dist\windows\NovaMicSwitch\NovaMicSwitch.exe'
          $System32 = Join-Path $env:WINDIR 'System32'
          $env:PATH = $System32
          $QuotedOutput = '"' + $ProbeJson.Replace('"', '\"') + '"'
          $Process = Start-Process -FilePath $Exe -ArgumentList @('--media-probe', '--output-json', $QuotedOutput) -PassThru -WindowStyle Hidden
          if (-not $Process.WaitForExit(60000)) {
            Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
            $Process.WaitForExit()
            throw 'Frozen Qt Multimedia backend probe exceeded 60 seconds.'
          }
          $Process.Refresh()
          if ($Process.ExitCode -ne 0) { throw "Frozen Qt Multimedia backend probe failed with exit code $($Process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $ProbeJson -PathType Leaf)) { throw "Frozen backend probe JSON missing: $ProbeJson" }
      - name: Upload Windows native evidence metadata
        if: ${{ !cancelled() && success() && hashFiles('build/native-evidence/report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-windows
          path: |
            build/native-evidence/report.json
            build/native-evidence/windows/media-probe.json
            build/native-evidence/notices/**/*.txt
          if-no-files-found: error
      - name: Smoke-test frozen Windows executable without opening devices
        shell: pwsh
        run: |
          $SmokeConfig = Join-Path $env:GITHUB_WORKSPACE 'build\windows-frozen-smoke'
          New-Item -ItemType Directory -Force -Path $SmokeConfig | Out-Null
          $SettingsPath = Join-Path $SmokeConfig 'settings.json'
          if (Test-Path -LiteralPath $SettingsPath) { throw "Smoke config unexpectedly already has settings.json: $SettingsPath" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $Exe = Join-Path $env:GITHUB_WORKSPACE 'dist\windows\NovaMicSwitch\NovaMicSwitch.exe'
          $QuotedSmokeConfig = '"' + $SmokeConfig.Replace('"', '\"') + '"'
          $Process = Start-Process -FilePath $Exe -ArgumentList @('--safe-mode', '--config-dir', $QuotedSmokeConfig, '--smoke-test') -PassThru -WindowStyle Hidden
          if (-not $Process.WaitForExit(60000)) {
            Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
            $Process.WaitForExit()
            throw 'Frozen GUI smoke test exceeded 60 seconds.'
          }
          $Process.Refresh()
          if ($Process.ExitCode -ne 0) { throw "Frozen GUI smoke test failed with exit code $($Process.ExitCode)" }
          if (Test-Path -LiteralPath $SettingsPath) { throw 'Safe-mode smoke test unexpectedly created settings.json' }
          $LicenseRoot = Join-Path $env:GITHUB_WORKSPACE 'dist\windows\NovaMicSwitch\_internal\licenses'
          foreach ($Relative in @('manifest.json', 'THIRD-PARTY-NOTICES.md', 'Python-LICENSE.txt', 'qt-6.12.0\LGPL-3.0-only.txt', 'ffmpeg-9.0.1\qt_attribution.json', 'ffmpeg-9.0.1\LICENSE.LGPL-2.1-or-later.txt')) {
            $LicensePath = Join-Path $LicenseRoot $Relative
            if (-not (Test-Path -LiteralPath $LicensePath -PathType Leaf)) { throw "Frozen Windows license payload missing: $LicensePath" }
            if ((Get-Item -LiteralPath $LicensePath).Length -le 0) { throw "Frozen Windows license payload is empty: $LicensePath" }
          }
          Write-Output 'Frozen Windows license manifest SHA-256:'
          Get-FileHash -LiteralPath (Join-Path $LicenseRoot 'manifest.json') -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), 'manifest.json' }
          $BundleRoot = Join-Path $env:GITHUB_WORKSPACE 'dist\windows\NovaMicSwitch'
          $BundleFiles = Get-ChildItem -LiteralPath $BundleRoot -File -Recurse
          Write-Output "Frozen Windows bundle file count: $($BundleFiles.Count)"
          Write-Output 'Frozen Windows native payload inventory:'
          $BundleFiles | Where-Object { $_.Extension -in @('.dll', '.pyd', '.exe') } | ForEach-Object { $_.FullName.Substring($BundleRoot.Length + 1) } | Sort-Object
          $Forbidden = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist\windows\NovaMicSwitch') -File -Recurse | Where-Object { $_.FullName -match '(?i)virtualkeyboard|libqt6pdf|qpdf\.dll|libqpdf\.so' }
          if ($Forbidden) { throw "Frozen Windows bundle unexpectedly contains excluded Qt Virtual Keyboard/PDF files: $($Forbidden.FullName -join ', ')" }
      - name: Upload Windows release artifact
        if: ${{ inputs.license_reviewed }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: dist/installers/*
          if-no-files-found: error

  corresponding-sources:
    name: Capture and verify corresponding sources
    runs-on: ubuntu-22.04
    needs: [validate-inputs, linux-x86_64, windows-x64]
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download fresh Linux native evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-evidence-linux
          path: build/native-evidence-linux
      - name: Capture pinned upstream and exact Ubuntu sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_assets.py --cache-dir build/source-cache --output-dir dist/sources --fetch
          python scripts/build_ubuntu_sources.py --report-json build/native-evidence-linux/report.json --cache-dir build/ubuntu-source-cache --output-dir dist/ubuntu-sources --fetch
      - name: Fetch bounded AppImage runtime source archives
        run: python scripts/fetch_runtime_sources.py --output-dir build/runtime-materials/sources --fetch
      - name: Build deterministic corresponding-source bundle
        env:
          APPLICATION_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/build_release_sources.py
          --upstream-dir dist/sources
          --ubuntu-dir dist/ubuntu-sources
          --runtime-dir build/runtime-materials
          --linux-report build/native-evidence-linux/report.json
          --output-dir dist/release-sources
          --application-commit "$APPLICATION_COMMIT"
          --require-complete
      - name: Create source-asset checksum set
        env:
          RELEASE_VERSION: ${{ needs.validate-inputs.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base="NovaMicSwitch-$RELEASE_VERSION-Corresponding-Sources"
          cd dist/release-sources
          test -s "$base.tar"
          test -s "$base.tar.sha256"
          test -s SOURCE-INDEX.md
          test -s source-bundle-index.json
          (sha256sum "$base.tar" SOURCE-INDEX.md source-bundle-index.json > SHA256SUMS)
          sha256sum -c SHA256SUMS
          sha256sum -c "$base.tar.sha256"
          test "$(wc -l < SHA256SUMS)" -eq 3
      - name: Upload source evidence metadata
        if: ${{ !cancelled() && success() && hashFiles('dist/release-sources/source-bundle-index.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corresponding-source-evidence
          path: |
            dist/release-sources/SOURCE-INDEX.md
            dist/release-sources/source-bundle-index.json
          if-no-files-found: error
      - name: Upload corresponding-source release assets
        if: ${{ inputs.license_reviewed }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nova-mic-sources
          path: |
            dist/release-sources/NovaMicSwitch-${{ needs.validate-inputs.outputs.version }}-Corresponding-Sources.tar
            dist/release-sources/NovaMicSwitch-${{ needs.validate-inputs.outputs.version }}-Corresponding-Sources.tar.sha256
            dist/release-sources/SOURCE-INDEX.md
            dist/release-sources/source-bundle-index.json
            dist/release-sources/SHA256SUMS
          if-no-files-found: error

  publish-draft:
    name: Create draft GitHub release
    if: ${{ inputs.publish }}
    needs: [validate-inputs, linux-x86_64, windows-x64, corresponding-sources]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: release-assets/linux-x86_64
      - name: Download Windows release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release-assets/windows-x64
      - name: Download corresponding-source release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nova-mic-sources
          path: release-assets/corresponding-sources
      - name: Verify artifact sets and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate-inputs.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          linux="NovaMicSwitch-$version-x86_64.AppImage"
          windows="NovaMicSwitch-Setup-$version.exe"
          source="NovaMicSwitch-$version-Corresponding-Sources"
          test -s "release-assets/linux-x86_64/$linux"
          test -s "release-assets/linux-x86_64/$linux.sha256"
          test -s release-assets/linux-x86_64/SHA256SUMS
          test -s "release-assets/windows-x64/$windows"
          test -s "release-assets/windows-x64/$windows.sha256"
          test -s release-assets/windows-x64/SHA256SUMS
          test -s "release-assets/corresponding-sources/$source.tar"
          test -s "release-assets/corresponding-sources/$source.tar.sha256"
          test -s "release-assets/corresponding-sources/SOURCE-INDEX.md"
          test -s "release-assets/corresponding-sources/source-bundle-index.json"
          test -s "release-assets/corresponding-sources/SHA256SUMS"
          (cd release-assets/linux-x86_64 && sha256sum -c SHA256SUMS)
          (cd release-assets/linux-x86_64 && sha256sum -c "$linux.sha256")
          cmp -s "release-assets/linux-x86_64/$linux.sha256" release-assets/linux-x86_64/SHA256SUMS
          (cd release-assets/windows-x64 && sha256sum -c SHA256SUMS)
          (cd release-assets/windows-x64 && sha256sum -c "$windows.sha256")
          cmp -s "release-assets/windows-x64/$windows.sha256" release-assets/windows-x64/SHA256SUMS
          (cd release-assets/corresponding-sources && sha256sum -c SHA256SUMS && sha256sum -c "$source.tar.sha256")
          grep -Eq "^[0-9a-f]{64}  $source.tar$" "release-assets/corresponding-sources/$source.tar.sha256"
          test "$(wc -l < release-assets/corresponding-sources/SHA256SUMS)" -eq 3
          grep -F "$source.tar" release-assets/corresponding-sources/SHA256SUMS >/dev/null
          grep -F 'SOURCE-INDEX.md' release-assets/corresponding-sources/SHA256SUMS >/dev/null
          grep -F 'source-bundle-index.json' release-assets/corresponding-sources/SHA256SUMS >/dev/null
          final=release-assets/final
          if [[ -e "$final" || -L "$final" ]]; then
            echo "Refusing to reuse existing final asset directory: $final" >&2
            exit 1
          fi
          assets=(
            "release-assets/linux-x86_64/$linux"
            "release-assets/linux-x86_64/$linux.sha256"
            "release-assets/windows-x64/$windows"
            "release-assets/windows-x64/$windows.sha256"
            "release-assets/corresponding-sources/$source.tar"
            "release-assets/corresponding-sources/$source.tar.sha256"
            release-assets/corresponding-sources/SOURCE-INDEX.md
            release-assets/corresponding-sources/source-bundle-index.json
          )
          basenames=()
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]] || { echo "Expected regular release asset missing or unsafe: $asset" >&2; exit 1; }
            basenames+=("$(basename -- "$asset")")
          done
          test "$(printf '%s\n' "${basenames[@]}" | sort -u | wc -l)" -eq 8
          mkdir -- "$final"
          for i in "${!assets[@]}"; do
            destination="$final/${basenames[$i]}"
            [[ ! -e "$destination" && ! -L "$destination" ]] || { echo "Unexpected final asset collision: $destination" >&2; exit 1; }
            cp -- "${assets[$i]}" "$destination"
            [[ -f "$destination" && ! -L "$destination" ]] || { echo "Final asset is not a regular file: $destination" >&2; exit 1; }
          done
          (
            cd "$final"
            sha256sum "${basenames[@]}" > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 8
            test "$(awk '{print $2}' SHA256SUMS | sort -u | wc -l)" -eq 8
            sha256sum -c SHA256SUMS
          )
      - name: Create a new draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-inputs.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to edit or overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "release-assets/final/NovaMicSwitch-$RELEASE_VERSION-x86_64.AppImage" \
            "release-assets/final/NovaMicSwitch-$RELEASE_VERSION-x86_64.AppImage.sha256" \
            "release-assets/final/NovaMicSwitch-Setup-$RELEASE_VERSION.exe" \
            "release-assets/final/NovaMicSwitch-Setup-$RELEASE_VERSION.exe.sha256" \
            "release-assets/final/NovaMicSwitch-$RELEASE_VERSION-Corresponding-Sources.tar" \
            "release-assets/final/NovaMicSwitch-$RELEASE_VERSION-Corresponding-Sources.tar.sha256" \
            "release-assets/final/SOURCE-INDEX.md" \
            "release-assets/final/source-bundle-index.json" \
            "release-assets/final/SHA256SUMS" \
            --verify-tag --draft --title "Nova Mic Switch $RELEASE_VERSION" \
            --notes "First release candidate. The corresponding-source bundle and its indexes are attached; review the included scope and limitations. Windows GUI smoke and cross-platform unit tests passed in CI; no real Nova HID hardware or end-to-end microphone/audio routing was tested by this workflow. Review platform compatibility, permissions, and third-party notices before publishing this draft."
