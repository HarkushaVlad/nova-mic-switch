[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-mic-switch"
version = "0.1.0"
description = "A desktop utility for switching between a computer microphone and a Nova 5 headset microphone"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14", "PySide6>=6.8,<7"]

[project.scripts]
nova-mic = "nova_mic_switch.cli:main"

[project.gui-scripts]
nova-mic-gui = "nova_mic_switch.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.15,<7",
]
